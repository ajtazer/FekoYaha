<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/assets/icon.png" type="image/png" />
    <title>FekoYaha — throw it here</title>
    <script>
      // GitHub Pages SPA: 404.html redirects a deep link (e.g. /myroom) to
      // "/?/myroom"; restore the real path before React Router mounts.
      // https://github.com/rafgraph/spa-github-pages
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&') })
            .join('?')
          var parts = decoded.split('?')
          var path = parts[0].replace(/\/+$/, '') || '/'
          var query = parts.slice(1).join('?')
          if (query && query.charAt(0) !== '/') path += '?' + query
          window.history.replaceState(null, null, path + l.hash)
        }
      })(window.location)
    </script>
    <meta name="description" content="Instant, no-login chat and file sharing rooms. Pick a keyword and start sharing." />
    <meta name="theme-color" content="#0b1220" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="FekoYaha — throw it here" />
    <meta property="og:description" content="Instant, no-login chat and file sharing rooms. Pick a keyword and start sharing." />
    <meta property="og:image" content="/assets/icon.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
